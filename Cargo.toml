[workspace]
members = ["poc-jobs", "poc-storage", "poc-redis", "poc-config"]
resolver = "2"

[workspace.package]
repository = "https://github.com/anilpandeyfinzly/test-repo"
homepage = "https://github.com/anilpandeyfinzly/test-repo"

[workspace.dependencies]
poc-config = { path = "poc-config", version = "1.1.8-alpha.5" }
poc-jobs = { path = "poc-jobs", version = "0.1.1-alpha.3" }
poc-redis = { path = "poc-redis", version = "0.1.1-alpha.5" }
poc-storage = { path = "poc-storage", version = "0.1.1-alpha.5" }
